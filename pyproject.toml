[project]
name = "sl-say"
version = "0.1.0"
description = "Firestorm chat.txt watcher with TTS readout (Windows/macOS)"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.3.1",
]

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
